name: Windows verification
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Check local runner contracts
        run: |
          ./scripts/Test-VerificationRunner.ps1
          exit $LASTEXITCODE
        shell: pwsh
      - name: Restore, build and run all automated tests
        run: |
          ./test.ps1 -Release
          exit $LASTEXITCODE
        shell: pwsh
      - name: Publish Windows x64
        run: ./scripts/Publish-Windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: PeripheralBatteryCompanion-win-x64
          path: artifacts/PeripheralBatteryCompanion-win-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            test-results/latest.log
            test-results/summary.txt
            test-results/automated/**/*.trx
          if-no-files-found: warn
