name: Build and test Stage 3
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore PeripheralBatteryCompanion.sln --locked-mode
      - run: dotnet build PeripheralBatteryCompanion.sln -c Debug --no-restore
      - run: dotnet test tests/PeripheralBatteryCompanion.Tests -c Release --no-restore --logger "trx;LogFileName=stage3.trx"
      - run: ./scripts/Publish-Windows.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: PeripheralBatteryCompanion-win-x64
          path: artifacts/PeripheralBatteryCompanion-win-x64.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
